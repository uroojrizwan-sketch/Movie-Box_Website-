<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Zone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/9357/9357566.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-black text-light">

    <div class="navbar">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/9357/9357566.png" alt="Movie Zone">
            <h3>MOVIE </h3><h3 style="color: rgb(239, 225, 79); margin-left: -10px;" >ZONE</h3>
        </div>
        <div class="search">
            <input  type="text" placeholder="Search Your Movie">
        </div>
    </div>

    <div class="cont my-3 text-center  " >
        <button id="All" type="button" class="btn btn-primary mx-3 px-3 ">All</button>
        <button id="Action" type="button" class="btn btn-secondary mx-3 px-3 ">Action</button>
        <button id="Thriller" type="button" class="btn btn-success mx-3 px-3 ">Thriller</button>
        <button id="Animation" type="button" class="btn btn-danger mx-3 px-3 ">Animation</button>
        <button id="Horror" type="button" class="btn btn-warning mx-3 px-3 ">Horror</button>
        <button id="Mystery" type="button" class="btn btn-info mx-3 px-3 ">Mystery</button>
        <button id="Mind-Bending" type="button" class="btn btn-light mx-3 px-3 ">Mind-Bending</button>
        <button id="Sci-Fi" type="button" class="btn btn-dark mx-3 px-3 ">Sci-Fi</button>
    </div>

    <div class="dom-cont"></div>







    <script src="./index.js"></script>
</body>

</html>
